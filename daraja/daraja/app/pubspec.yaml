name: daraja_app
description: Daraja client portal (Flutter Web) - orders, growth tracking, pricing and billing.
publish_to: none
version: 0.1.0+1

environment:
  sdk: ">=3.6.0 <4.0.0"
  flutter: ">=3.27.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_web_plugins:
    sdk: flutter
  flutter_riverpod: ^2.6.1
  go_router: ^14.8.1
  url_launcher: ^6.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/data/
  fonts:
    - family: PlusJakartaSans
      fonts:
        - asset: assets/fonts/PlusJakartaSans_400Regular.ttf
          weight: 400
        - asset: assets/fonts/PlusJakartaSans_500Medium.ttf
          weight: 500
        - asset: assets/fonts/PlusJakartaSans_600SemiBold.ttf
          weight: 600
        - asset: assets/fonts/PlusJakartaSans_700Bold.ttf
          weight: 700
        - asset: assets/fonts/PlusJakartaSans_800ExtraBold.ttf
          weight: 800
