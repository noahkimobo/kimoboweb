<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Social Media Health Check</title>
<style>
:root{--bg:#f6f4ef;--card:#fff;--ink:#1b1b1f;--mut:#6b6b76;--line:#e4e1d8;--acc:#ff5a36;--acc2:#1f6feb;--ok:#14a76c;--warn:#f5a524;--bad:#e5484d;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#121216;--card:#1c1c22;--ink:#f2f2f5;--mut:#9a9aa6;--line:#2c2c35;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#121216;--card:#1c1c22;--ink:#f2f2f5;--mut:#9a9aa6;--line:#2c2c35;color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;line-height:1.5}
.wrap{max-width:660px;margin:0 auto;padding:20px 16px 48px}
.card{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:24px;box-shadow:0 8px 30px rgba(0,0,0,.06)}
h1{font-size:2rem;line-height:1.15;margin:.3em 0}
h2{font-size:1.35rem;margin:.2em 0}
.mut{color:var(--mut)}
.pill{display:inline-block;background:var(--acc);color:#fff;border-radius:99px;padding:3px 12px;font-size:.78rem;font-weight:700;letter-spacing:.04em}
.btn{background:var(--acc);color:#fff;border:0;border-radius:12px;padding:13px 22px;font-size:1rem;font-weight:700;cursor:pointer;text-decoration:none;display:inline-block}
.btn.ghost{background:transparent;color:var(--ink);border:1px solid var(--line)}
.btn:disabled{opacity:.35;cursor:not-allowed}
.bar{height:8px;background:var(--line);border-radius:9px;overflow:hidden;margin:0 0 20px}
.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--acc),var(--warn));transition:width .4s}
.q{margin:22px 0}
.q p{font-weight:600;margin:0 0 10px}
.opts{display:grid;gap:8px}
.opt{text-align:left;background:transparent;color:var(--ink);border:1.5px solid var(--line);border-radius:12px;padding:11px 14px;font-size:.95rem;cursor:pointer;transition:.15s}
.opt:hover{border-color:var(--acc)}
.opt.on{border-color:var(--acc);background:rgba(255,90,54,.12);font-weight:600}
.nav{display:flex;justify-content:space-between;gap:10px;margin-top:10px}
.ring{position:relative;width:200px;height:200px;margin:8px auto}
.ring b{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:3rem;line-height:1}
.ring b small{font-size:.8rem;font-weight:600;color:var(--mut);margin-top:4px}
.center{text-align:center}
.row{margin:12px 0}
.row div{display:flex;justify-content:space-between;font-size:.92rem;font-weight:600;margin-bottom:4px}
.row .t{height:9px;background:var(--line);border-radius:9px;overflow:hidden}
.row .t i{display:block;height:100%;border-radius:9px;transition:width .9s}
.fix{border-left:4px solid var(--acc);padding:6px 0 6px 12px;margin:12px 0}
.fix b{display:block}
.chart{overflow-x:auto}
.foot{font-size:.78rem;color:var(--mut);text-align:center;margin-top:18px}
.hide{display:none}
</style>
</head>
<body>
<div class="wrap"><div class="card" id="app"></div>
<p class="foot">Self-assessment for guidance only. For a full manual audit, talk to us.</p></div>
<script>
// ---- CONFIG: edit these ----
var BRAND="Daraja";
var WHATSAPP=""; // Replaced with the configured contact number during the production build.
// ----------------------------
var CATS=[
{k:"Profile & brand",w:10,i:"👤",tip:"Rewrite your bio to say what you sell, where, and for whom. Add a working link or WhatsApp button and use a real logo as your avatar.",q:[
["Your bio clearly says what you offer, where, and who it’s for.",["Not at all","Vaguely","Mostly","Crystal clear"]],
["Your profile has a working link or contact button.",["No link","Link, not tracked","Link that works","Tracked link/WhatsApp"]],
["Your avatar and name match your brand across every platform.",["No two match","Some match","Mostly match","Fully consistent"]]]},
{k:"Content",w:25,i:"🎬",tip:"Move from static posts to short video with a 2-second hook. Plan three pillars: education, proof, and offers, then reuse every project as content.",q:[
["What share of your posts are short video?",["None","Under 25%","25-60%","Over 60%"]],
["Do your posts open with a strong hook in the first 2 seconds?",["Never","Rarely","Often","Almost always"]],
["You publish proof: testimonials, results, case studies.",["Never","Once in a while","Monthly","Weekly"]]]},
{k:"Performance",w:20,i:"📈",tip:"Post at least 3 times a week for 30 days, then review top posts and double down on what earns saves, shares, and watch time.",q:[
["How often do you post?",["Under once a month","Monthly","Weekly","3+ times a week"]],
["Your follower count over the last 90 days is…",["Falling","Flat","Growing slowly","Growing steadily"]],
["Typical post reach compared to your follower count?",["Under 5%","5-15%","15-40%","Over 40%"]]]},
{k:"Audience",w:15,i:"🎯",tip:"Check your analytics: if followers don’t match your ideal buyer’s age, place, and interests, adjust your topics and tags to attract the right people.",q:[
["You know the age, gender, and location of your followers.",["No idea","Roughly","Checked once","Reviewed monthly"]],
["Most followers are in your target market and buyer group.",["Few are","Some","Most","Nearly all"]],
["You answer common audience questions in your content.",["Never","Rarely","Sometimes","Regularly"]]]},
{k:"Conversion",w:20,i:"💬",tip:"Use one clear call to action per post, reply to every comment and DM within hours, and track leads from post to quote to sale.",q:[
["How fast do you reply to comments and DMs?",["Days or never","Within a day","Within hours","Within the hour"]],
["Every post has one clear call to action.",["None","Some","Most","All"]],
["You track where leads come from.",["Not at all","Memory","Spreadsheet","CRM or tagged links"]]]},
{k:"Discoverability",w:10,i:"🔍",tip:"Put the words buyers search for (product, price, city) in captions, on-screen text, and speech. Add location tags and a few specific hashtags.",q:[
["Captions and on-screen text include keywords buyers search.",["No","Sometimes","Often","Always"]],
["You use location tags and focused hashtags.",["Neither","One of them","Both, occasionally","Both, consistently"]],
["You publish price or “how much does it cost” content.",["Never","Once","Occasionally","Regularly"]]]}
];
var A=[],step=-1,app=document.getElementById("app");
CATS.forEach(function(c){A.push([null,null,null])});
function esc(s){return s}
function intro(){
app.innerHTML='<span class="pill">FREE · 3 MINUTES</span><h1>How healthy is your social media?</h1><p class="mut">Answer 18 quick questions across 6 areas and get your score, a breakdown, and the three fixes that will move the needle most.</p><button class="btn" onclick="go(0)">Start the check</button>';
}
function go(n){step=n;n>=CATS.length?result():ask()}
function ask(){
var c=CATS[step],h='<div class="bar"><i style="width:'+(step/CATS.length*100)+'%"></i></div><span class="pill">'+(step+1)+' / '+CATS.length+'</span><h2>'+c.i+' '+c.k+'</h2>';
c.q.forEach(function(q,qi){
h+='<div class="q"><p>'+q[0]+'</p><div class="opts">';
q[1].forEach(function(o,oi){h+='<button class="opt'+(A[step][qi]===oi?' on':'')+'" onclick="pick('+qi+','+oi+')">'+o+'</button>'});
h+='</div></div>'});
h+='<div class="nav"><button class="btn ghost" onclick="'+(step?'go('+(step-1)+')':'intro()')+'">Back</button><button class="btn" id="nx" onclick="go('+(step+1)+')" '+(A[step].indexOf(null)>-1?'disabled':'')+'>'+(step==CATS.length-1?'See my score':'Next')+'</button></div>';
app.innerHTML=h;
}
function pick(q,o){A[step][q]=o;ask()}
function pct(i){return A[i].reduce(function(a,b){return a+b},0)/9}
function col(p){return p>=.7?"var(--ok)":p>=.4?"var(--warn)":"var(--bad)"}
function result(){
var tot=0,rows=[];
CATS.forEach(function(c,i){var p=pct(i);tot+=p*c.w;rows.push({c:c,p:p})});
var s=Math.round(tot),g=s>=85?["Authority","You’re running a strong, conversion-ready account."]:s>=70?["Growth-ready","Solid base. A few tweaks will unlock real leads."]:s>=50?["Leaking leads","People find you, but too many slip away."]:s>=30?["Needs a reset","The fundamentals need rebuilding before you scale."]:["Starting line","Great news: every fix will show quickly."];
var h='<div class="center"><span class="pill">YOUR RESULT</span><div class="ring"><svg viewBox="0 0 200 200" width="200" height="200"><circle cx="100" cy="100" r="86" fill="none" stroke="var(--line)" stroke-width="16"/><circle id="arc" cx="100" cy="100" r="86" fill="none" stroke="'+col(s/100)+'" stroke-width="16" stroke-linecap="round" stroke-dasharray="0 540" transform="rotate(-90 100 100)" style="transition:stroke-dasharray 1.2s"/></svg><b>'+s+'<small>out of 100</small></b></div><h1>'+g[0]+'</h1><p class="mut">'+g[1]+'</p></div>';
h+='<div class="chart center">'+radar(rows)+'</div><h2>Score by area</h2>';
rows.forEach(function(r){h+='<div class="row"><div><span>'+r.c.i+' '+r.c.k+'</span><span>'+Math.round(r.p*100)+'%</span></div><div class="t" style="display:block"><i class="f" data-w="'+Math.round(r.p*100)+'" style="width:0;background:'+col(r.p)+'"></i></div></div>'});
var w=rows.slice().sort(function(a,b){return a.p*a.c.w-b.p*b.c.w}).slice(0,3);
h+='<h2 style="margin-top:26px">Your top 3 fixes</h2>';
w.forEach(function(r,i){h+='<div class="fix"><b>'+(i+1)+'. '+r.c.k+' ('+Math.round(r.p*100)+'%)</b><span class="mut">'+r.c.tip+'</span></div>'});
var msg=encodeURIComponent("Hi "+BRAND+", I scored "+s+"/100 ("+g[0]+") on your Social Media Health Check. Weakest areas: "+w.map(function(r){return r.c.k}).join(", ")+". Can you help?");
var action=WHATSAPP?'<a class="btn" href="https://wa.me/'+WHATSAPP+'?text='+msg+'" target="_blank" rel="noopener">Get my free action plan</a>':'<a class="btn" href="/daraja/contact/">Talk to Daraja</a>';
h+='<div class="center" style="margin-top:24px">'+action+' <button class="btn ghost" onclick="again()">Retake</button></div>';
app.innerHTML=h;
setTimeout(function(){document.getElementById("arc").setAttribute("stroke-dasharray",(s/100*540)+" 540");document.querySelectorAll(".f").forEach(function(e){e.style.width=e.dataset.w+"%"})},60);
}
function radar(rows){
var n=rows.length,cx=150,cy=140,R=95,pts=[],grid="",lab="";
for(var r=1;r<=4;r++){var p=[];for(var i=0;i<n;i++){var a=i/n*2*Math.PI-Math.PI/2;p.push((cx+R*r/4*Math.cos(a)).toFixed(1)+","+(cy+R*r/4*Math.sin(a)).toFixed(1))}grid+='<polygon points="'+p.join(" ")+'" fill="none" stroke="var(--line)"/>'}
rows.forEach(function(x,i){var a=i/n*2*Math.PI-Math.PI/2;pts.push((cx+R*Math.max(x.p,.04)*Math.cos(a)).toFixed(1)+","+(cy+R*Math.max(x.p,.04)*Math.sin(a)).toFixed(1));lab+='<text x="'+(cx+(R+24)*Math.cos(a)).toFixed(1)+'" y="'+(cy+(R+20)*Math.sin(a)+4).toFixed(1)+'" text-anchor="middle" font-size="11" fill="var(--mut)">'+x.c.i+' '+x.c.k.split(" ")[0]+'</text>'});
return '<svg viewBox="0 0 300 290" width="100%" style="max-width:340px">'+grid+'<polygon points="'+pts.join(" ")+'" fill="rgba(255,90,54,.25)" stroke="var(--acc)" stroke-width="2"/>'+lab+'</svg>';
}
function again(){A=[];CATS.forEach(function(){A.push([null,null,null])});intro()}
intro();
</script>
</body>
</html>
